<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vêtements</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/buttons.css">
    <script src="js/script.js"></script>
    <style>
      /* ─── Boutons taille ─── */
      .tailles { display:flex; flex-wrap:wrap; gap:5px; margin:6px 0; }
      .btn-taille {
        min-width:34px; height:30px; padding:0 7px;
        border:1.5px solid #d1d5db; border-radius:6px;
        background:#fff; font-size:12px; font-weight:600;
        cursor:pointer; color:#374151; transition:.15s;
      }
      .btn-taille:hover:not(.epuise){ border-color:#6366f1; color:#6366f1; }
      .btn-taille.selected{ background:#6366f1; border-color:#6366f1; color:#fff; }
      .btn-taille.epuise{ background:#f3f4f6; color:#ccc; border-color:#e5e7eb; cursor:not-allowed; text-decoration:line-through; }

      /* ─── Boutons couleur ─── */
      .couleurs { display:flex; flex-wrap:wrap; gap:5px; margin:4px 0 8px; }
      .btn-couleur {
        width:22px; height:22px; border-radius:50%;
        border:2px solid transparent; cursor:pointer; transition:.15s;
        position:relative;
      }
      .btn-couleur:hover:not(.epuise){ transform:scale(1.2); }
      .btn-couleur.selected{ border-color:#6366f1; transform:scale(1.15); }
      .btn-couleur.epuise{ opacity:.3; cursor:not-allowed; }
      .btn-couleur[title]:hover::after{
        content:attr(title); position:absolute; bottom:26px; left:50%;
        transform:translateX(-50%); background:#1f2937; color:#fff;
        font-size:10px; padding:2px 6px; border-radius:4px; white-space:nowrap;
      }

      /* ─── Labels section ─── */
      .lbl { font-size:10px; font-weight:700; color:#9ca3af; text-transform:uppercase; letter-spacing:.4px; }

      /* ─── Badge stock ─── */
      .badge-stock {
        display:inline-block; font-size:11px; font-weight:600;
        padding:2px 8px; border-radius:20px; margin:5px 0 2px;
      }
      .s-ok   { background:#dcfce7; color:#16a34a; }
      .s-bas  { background:#fef9c3; color:#a16207; }
      .s-zero { background:#fee2e2; color:#dc2626; }

      /* ─── Info sélection ─── */
      .sel-info { font-size:11px; min-height:16px; margin:3px 0 6px; color:#6b7280; }
      .sel-info.ok   { color:#16a34a; font-weight:600; }
      .sel-info.warn { color:#d97706; font-weight:600; }
      .sel-info.err  { color:#dc2626; font-weight:600; }

      /* ─── Carte épuisée ─── */
      .pc.tout-epuise { opacity:.65; }
      .pc.tout-epuise .pc-actions { display:none; }
      .epuise-banner {
        position:absolute; top:10px; right:-8px;
        background:#dc2626; color:#fff; font-size:10px; font-weight:700;
        padding:3px 10px; border-radius:4px; transform:rotate(3deg);
        box-shadow:0 2px 6px rgba(220,38,38,.35); z-index:3;
      }
      .pc { position:relative; }
    </style>
</head>
<body>
<div class="produits-grid">

  <!-- ══ HOMME ══ -->
  <div class="pc" data-id="1" data-nom="pantalon" data-prix="19.99" data-img="./images/pant.jpg">
    <img src="./images/pant.jpg" alt="pantalon">
    <h3>pantalon</h3><p>$19.99</p>
  </div>
  <div class="pc" data-id="2" data-nom="chemise" data-prix="14.99" data-img="./images/chemise.webp">
    <img src="./images/chemise.webp" alt="chemise">
    <h3>chemise</h3><p>$14.99</p>
  </div>
  <div class="pc" data-id="3" data-nom="veste" data-prix="49.99" data-img="./images/jacket.jpg">
    <img src="./images/jacket.jpg" alt="veste">
    <h3>veste</h3><p>$49.99</p>
  </div>
  <div class="pc" data-id="4" data-nom="set homme" data-prix="60" data-img="./images/sethomme.jpg">
    <img src="./images/sethomme.jpg" alt="set homme">
    <h3>set homme</h3><p>$60</p>
  </div>
  <div class="pc" data-id="5" data-nom="pantalon a pince" data-prix="85" data-img="./images/pantalonh.jpg">
    <img src="./images/pantalonh.jpg" alt="pantalon homme">
    <h3>pantalon a pince</h3><p>$85</p>
  </div>
  <div class="pc" data-id="6" data-nom="short" data-prix="40" data-img="./images/short.jpg">
    <img src="./images/short.jpg" alt="short">
    <h3>short</h3><p>$40</p>
  </div>
  <div class="pc" data-id="7" data-nom="set djean" data-prix="140" data-img="./images/setdjeanh.jpg">
    <img src="./images/setdjeanh.jpg" alt="set djean">
    <h3>set djean</h3><p>$140</p>
  </div>
  <div class="pc" data-id="8" data-nom="set plage" data-prix="95" data-img="./images/setplage.jpg">
    <img src="./images/setplage.jpg" alt="set plage">
    <h3>set plage</h3><p>$95</p>
  </div>
  <div class="pc" data-id="9" data-nom="pull" data-prix="35" data-img="./images/pull.jpg">
    <img src="./images/pull.jpg" alt="pull">
    <h3>pull</h3><p>$35</p>
  </div>
  <div class="pc" data-id="10" data-nom="veste" data-prix="120" data-img="./images/doudoun.jpg">
    <img src="./images/doudoun.jpg" alt="veste">
    <h3>veste</h3><p>$120</p>
  </div>
  <div class="pc" data-id="11" data-nom="costume chic" data-prix="200" data-img="./images/costume.jpg">
    <img src="./images/costume.jpg" alt="costume">
    <h3>costume chic</h3><p>$200</p>
  </div>
  <div class="pc" data-id="12" data-nom="pull" data-prix="30" data-img="./images/pullh.jpg">
    <img src="./images/pullh.jpg" alt="pull">
    <h3>pull</h3><p>$30</p>
  </div>

</div>

<script>
const COULEUR_CSS = {
  'Noir':'#1f2937','Blanc':'#f1f5f9','Gris':'#9ca3af',
  'Bleu':'#3b82f6','Rouge':'#ef4444','Vert':'#22c55e',
  'Marron':'#92400e','Rose':'#f472b6','Beige':'#d4a17a'
};

document.querySelectorAll('.pc[data-id]').forEach(async carte => {
  const id   = carte.dataset.id;
  const nom  = carte.dataset.nom;
  const prix = carte.dataset.prix;
  const img  = carte.dataset.img;

  // Charger les variantes
  let variantes = [];
  try {
    const r = await fetch(`/api/produit/${id}/variantes`);
    const d = await r.json();
    variantes = d.success ? d.variantes : [];
  } catch(e) {}

  const totalStock = variantes.reduce((s,v) => s + v.quantite, 0);

  // Badge stock global
  let badgeHtml = '';
  if (totalStock === 0)     badgeHtml = '<span class="badge-stock s-zero">⛔ Épuisé</span>';
  else if (totalStock <= 5) badgeHtml = `<span class="badge-stock s-bas">⚠️ Plus que ${totalStock}</span>`;
  else                      badgeHtml = '<span class="badge-stock s-ok">✅ En stock</span>';

  carte.querySelector('p').insertAdjacentHTML('afterend', badgeHtml);

  if (totalStock === 0) {
    carte.classList.add('tout-epuise');
    carte.insertAdjacentHTML('beforeend', '<span class="epuise-banner">ÉPUISÉ</span>');
    return; // pas de sélecteur
  }

  // Tailles disponibles
  const tailles  = [...new Set(variantes.map(v => v.taille))];
  const couleurs = [...new Set(variantes.map(v => v.couleur))];

  // Construire le sélecteur
  const sel = document.createElement('div');
  sel.className = 'variante-sel';

  sel.innerHTML = `
    <div class="lbl">Taille</div>
    <div class="tailles">
      ${tailles.map(t => {
        const stk = variantes.filter(v => v.taille===t).reduce((s,v)=>s+v.quantite,0);
        return `<button class="btn-taille${stk===0?' epuise':''}" data-t="${t}">${t}</button>`;
      }).join('')}
    </div>
    <div class="lbl">Couleur</div>
    <div class="couleurs">
      ${couleurs.map(c => {
        const stk = variantes.filter(v => v.couleur===c).reduce((s,v)=>s+v.quantite,0);
        const bg  = COULEUR_CSS[c]||'#e5e7eb';
        const brd = c==='Blanc'?'outline:1.5px solid #d1d5db;':'';
        return `<span class="btn-couleur${stk===0?' epuise':''}" data-c="${c}" title="${c}" style="background:${bg};${brd}"></span>`;
      }).join('')}
    </div>
    <div class="sel-info" id="info-${id}"></div>
    <div class="pc-actions">
      <button class="btn-panier btn-panier-active" onclick="event.stopPropagation();ajouterVariante('${id}','${nom}','${prix}','${img}',false)">
        <i class="ti ti-shopping-cart-plus"></i> Panier
      </button>
      <button class="btn-commander-direct" onclick="event.stopPropagation();ajouterVariante('${id}','${nom}','${prix}','${img}',true)">
        <i class="ti ti-bolt"></i> Acheter
      </button>
    </div>`;

  carte.appendChild(sel);

  // État sélection
  let selT = null, selC = null;

  function majInfo() {
    const el = document.getElementById('info-'+id);
    if (!selT && !selC) { el.textContent=''; el.className='sel-info'; return; }
    if (!selT) { el.textContent='Choisir une taille'; el.className='sel-info'; return; }
    if (!selC) { el.textContent='Choisir une couleur'; el.className='sel-info'; return; }
    const v = variantes.find(x => x.taille===selT && x.couleur===selC);
    if (!v || v.quantite===0) {
      el.textContent='⛔ Épuisé pour cette combinaison'; el.className='sel-info err';
    } else if (v.quantite<=3) {
      el.textContent=`⚠️ Plus que ${v.quantite} disponible`; el.className='sel-info warn';
    } else {
      el.textContent=`✅ ${v.quantite} en stock`; el.className='sel-info ok';
    }
  }

  // Clics taille
  sel.querySelectorAll('.btn-taille:not(.epuise)').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      sel.querySelectorAll('.btn-taille').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      selT = b.dataset.t;
      // Mettre à jour couleurs épuisées pour cette taille
      sel.querySelectorAll('.btn-couleur').forEach(bc => {
        const v = variantes.find(x => x.taille===selT && x.couleur===bc.dataset.c);
        bc.classList.toggle('epuise', !v || v.quantite===0);
      });
      majInfo();
    });
  });

  // Clics couleur
  sel.querySelectorAll('.btn-couleur:not(.epuise)').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      sel.querySelectorAll('.btn-couleur').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      selC = b.dataset.c;
      majInfo();
    });
  });

  // Stocker état dans la carte pour les boutons
  carte._getSelection = () => ({ selT, selC, variantes });
});

// Ajouter au panier ou commander avec la variante choisie
function ajouterVariante(id, nom, prix, img, acheter) {
  const carte = document.querySelector(`.pc[data-id="${id}"]`);
  if (!carte._getSelection) return;
  const { selT, selC, variantes } = carte._getSelection();

  if (!selT || !selC) {
    const el = document.getElementById('info-'+id);
    el.textContent = '⚠️ Choisir une taille et une couleur'; el.className='sel-info err';
    return;
  }
  const v = variantes.find(x => x.taille===selT && x.couleur===selC);
  if (!v || v.quantite===0) {
    const el = document.getElementById('info-'+id);
    el.textContent = '⛔ Épuisé pour cette combinaison'; el.className='sel-info err';
    return;
  }

  const nomComplet = `${nom} - Taille ${selT} / ${selC}`;
  fetch('/api/stock/decrementer', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ id_variante: v.id_variante })
  });

  if (acheter) {
    commander(nomComplet, prix, img);
  } else {
    ajouterAuPanier(nomComplet, prix, img);
  }
}
</script>
</body>
</html>
